name: nrc-second-brain

services:
  app:
    image: ghcr.io/mkonline08/nrc-second-brain:latest
    container_name: nrc-second-brain
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      APP_BASE_URL: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      OPENAI_API_KEY: ""
      AI_MODEL: gpt-5
      LIBRARY_DIR: /library
    volumes:
      - /DATA/AppData/nrc-second-brain:/app/data
      - /DATA/Media:/library:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  author: MK
  category: Utilities
  developer: MK
  tagline:
    en_us: Private files, notes, study tools, and a visual knowledge graph.
  title:
    en_us: NRC Second Brain
  index: /
  port_map: "3000"
  scheme: http

