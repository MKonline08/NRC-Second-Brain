name: nrc-second-brain

services:
  app:
    build: .
    container_name: nrc-second-brain
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5}
      LIBRARY_DIR: /library
    volumes:
      - /DATA/AppData/nrc-second-brain:/app/data
      # Change the left-side path to the CasaOS folder you want NRC to index. It stays read-only.
      - /DATA/Media:/library:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

