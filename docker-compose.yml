services:
  app:
    build: .
    container_name: nrc-second-brain
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nrc:${POSTGRES_PASSWORD}@db:5432/nrc_second_brain
      UPLOAD_DIR: /app/data/uploads
      LIBRARY_DIR: /library
    volumes:
      - /DATA/AppData/nrc-second-brain/uploads:/app/data/uploads
      - /DATA/AppData/nrc-second-brain/config:/app/data/config
      # Change the left-side path to the CasaOS folder you want NRC to index. It stays read-only.
      - /DATA/Media:/library:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
  migrate:
    build:
      context: .
      target: migrate
    container_name: nrc-second-brain-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nrc:${POSTGRES_PASSWORD}@db:5432/nrc_second_brain
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: nrc-second-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nrc_second_brain
      POSTGRES_USER: nrc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /DATA/AppData/nrc-second-brain/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrc -d nrc_second_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
